{% extends "base.html" %}
{% block title %}লগইন - স্মার্ট ইনভয়েস{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 to-primary-100 px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary-600 text-white rounded-2xl flex items-center justify-center text-2xl font-bold mx-auto mb-4">সি</div>
            <h1 class="text-2xl font-bold text-gray-800">লগইন করুন</h1>
            <p class="text-gray-500 mt-1">আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
        </div>
        
        {% if error %}
        <div data-alert class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/login" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">মোবাইল নম্বর</label>
                <input type="text" name="mobile" required placeholder="01XXXXXXXXX" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড</label>
                <input type="password" name="password" required placeholder="আপনার পাসওয়ার্ড"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition">
            </div>
            <button type="submit" class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-semibold transition shadow-md">
                লগইন
            </button>
        </form>
        
        <p class="text-center text-gray-500 mt-6 text-sm">
            অ্যাকাউন্ট নেই? <a href="/register" class="text-primary-600 font-medium hover:underline">নিবন্ধন করুন</a>
        </p>
    </div>
</div>
{% endblock %}
