{% extends "base.html" %}
{% block title %}নিবন্ধন - স্মার্ট ইনভয়েস{% endblock %}
{% block body %}
<div class="min-h-screen bg-gradient-to-br from-primary-50 to-primary-100 py-10 px-4">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary-600 text-white rounded-2xl flex items-center justify-center text-2xl font-bold mx-auto mb-4">সি</div>
            <h1 class="text-2xl font-bold">নতুন অ্যাকাউন্ট তৈরি করুন</h1>
            <p class="text-gray-500 mt-1">আপনার দোকানের তথ্য দিয়ে নিবন্ধন করুন</p>
        </div>
        
        {% if error %}
        <div data-alert class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/register" enctype="multipart/form-data" class="space-y-5">
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">পূর্ণ নাম *</label>
                    <input type="text" name="name" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">মোবাইল নম্বর *</label>
                    <input type="text" name="mobile" required placeholder="01XXXXXXXXX" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
            </div>
            
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ই-মেইল (ঐচ্ছিক)</label>
                    <input type="email" name="email" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড *</label>
                    <input type="password" name="password" required minlength="6" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
            </div>
            
            <hr class="border-gray-200">
            <h3 class="font-semibold text-lg text-primary-700">দোকানের তথ্য</h3>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">দোকানের নাম *</label>
                <input type="text" name="store_name" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">দোকানের ঠিকানা *</label>
                <textarea name="address" required rows="2" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none"></textarea>
            </div>
            
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">জেলা *</label>
                    <input type="text" name="district" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">উপজেলা/এলাকা *</label>
                    <input type="text" name="upazila" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ব্যবসার ক্যাটাগরি *</label>
                <select name="category_id" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none">
                    <option value="">ক্যাটাগরি নির্বাচন করুন</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name_bn }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">দোকানের মোবাইল (ঐচ্ছিক)</label>
                    <input type="text" name="phone" placeholder="01XXXXXXXXX" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">লোগো (ঐচ্ছিক)</label>
                    <input type="file" name="logo" accept="image/*" class="w-full px-4 py-2 border border-gray-300 rounded-xl text-sm">
                </div>
            </div>
            
            <button type="submit" class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-semibold transition shadow-md mt-4">
                নিবন্ধন সম্পন্ন করুন
            </button>
        </form>
        
        <p class="text-center text-gray-500 mt-6 text-sm">
            ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="/login" class="text-primary-600 font-medium hover:underline">লগইন করুন</a>
        </p>
    </div>
</div>
{% endblock %}
